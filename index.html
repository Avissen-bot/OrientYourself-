<style>
:root{
  color-scheme:dark;
  --bg:#07060f; --panel:#100d1f; --line:#2a2540; --text:#fff; --muted:#a9a3c4;
  --blue:#2f7bff; --violet:#a855f7; --orange:#ff8a3d; --ink:#1b1250;
  --grad:linear-gradient(90deg,var(--blue),var(--violet) 50%,var(--orange));
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* navbar */
.nav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);width:min(1080px,calc(100% - 28px));z-index:20}
.bar{background:#fff;color:var(--ink);border-radius:18px;display:flex;align-items:center;gap:20px;padding:12px 14px 12px 18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.15rem}
.ring{width:22px;height:22px;border-radius:50%;border:3px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#d9a35c,#4f8cff) border-box}
.links{display:flex;gap:28px;margin:0 auto;font-size:.9rem;font-weight:500}
.links a:hover{color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;font:inherit;font-weight:600;border-radius:12px;padding:12px 22px;background:#1a45ff;color:#fff}
.btn:hover{background:#3a5cff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--violet)}
.icon{background:none;border:0;color:var(--ink);cursor:pointer;padding:6px;display:grid;place-items:center}
.burger{display:none}
.menu{display:none;background:#fff;color:var(--ink);border-radius:18px;margin-top:8px;padding:10px 18px;flex-direction:column}
.menu a{padding:12px 0;font-weight:500;border-bottom:1px solid #eceaf6}
.menu a:last-child{border:0}
.menu.open{display:flex}

/* hero */
.hero{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;padding:120px 24px 160px;overflow:hidden;isolation:isolate}
.glow{position:absolute;inset:0;z-index:-2;
  background:
    radial-gradient(40% 45% at 0% 45%,rgba(47,123,255,.55),transparent 70%),
    radial-gradient(40% 45% at 100% 40%,rgba(255,138,61,.5),transparent 70%),
    radial-gradient(60% 40% at 50% 100%,rgba(168,85,247,.45),transparent 70%)}
.rays{position:absolute;left:50%;bottom:-30%;width:180%;aspect-ratio:1;transform:translateX(-50%);z-index:-1;
  background:repeating-conic-gradient(from 270deg at 50% 100%,rgba(170,90,230,.0) 0 4deg,rgba(150,80,220,.5) 5deg 8deg,rgba(120,70,200,.1) 9deg 12deg);
  -webkit-mask:radial-gradient(60% 55% at 50% 100%,#000 25%,transparent 75%);mask:radial-gradient(60% 55% at 50% 100%,#000 25%,transparent 75%);
  opacity:.9}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:30%;background:linear-gradient(transparent,var(--bg));z-index:-1}
.hero-in{max-width:760px}
.eyebrow{font-weight:500;font-size:1rem;margin:0 0 18px}
h1{font-size:clamp(2.4rem,6.4vw,4.4rem);line-height:1.08;font-weight:500;letter-spacing:-.02em;margin:0 0 22px}
.lead{color:var(--muted);font-size:clamp(1rem,2vw,1.12rem);max-width:600px;margin:0 auto 32px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* sections */
section.s{padding:96px 24px;border-top:1px solid var(--line)}
.wrap{max-width:1000px;margin:0 auto}
h2{font-size:clamp(2rem,5vw,3.2rem);line-height:1.12;font-weight:500;letter-spacing:-.02em;margin:0 0 20px;text-align:center}
.sub{color:var(--muted);text-align:center;max-width:620px;margin:0 auto 56px}
.proof{background:radial-gradient(60% 80% at 50% 100%,rgba(168,85,247,.2),transparent 70%)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.stat{background:var(--panel);padding:32px 24px;text-align:center}
.stat b{display:block;font-size:2.6rem;font-weight:600;line-height:1.1}
.stat span{color:var(--muted);font-size:.95rem}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--grad);font-weight:700;margin-bottom:16px}
.steps h3{margin:0 0 8px;font-size:1.15rem;font-weight:600}
.steps p{margin:0;color:var(--muted);font-size:.95rem}
.final{text-align:center}
footer{border-top:1px solid var(--line);padding:28px 24px;color:var(--muted);font-size:.85rem;text-align:center}

label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
input,select{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px}
.form{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:14px;align-items:end;margin-top:36px}
.chips{display:flex;gap:8px;justify-content:center;margin:0 0 24px;flex-wrap:wrap}
.chip{font:inherit;font-size:.9rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:99px;padding:8px 16px;cursor:pointer}
.chip[aria-pressed=true]{color:#fff;border-color:var(--violet);background:rgba(168,85,247,.18)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h4{margin:0 0 4px;font-size:1.02rem;font-weight:600}
.card p{margin:0;color:var(--muted);font-size:.88rem}
.tag{display:inline-block;font-size:.75rem;border-radius:99px;padding:3px 10px;margin:10px 6px 0 0;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:#7ff0b0;border-color:#2c6b4a}.tag.mid{color:var(--orange);border-color:#7a4a25}
.note{color:var(--muted);font-size:.82rem;text-align:center;margin:20px 0 0}
.empty{color:var(--muted);text-align:center;grid-column:1/-1;padding:20px}
#res{margin-top:28px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(7,6,15,.82);backdrop-filter:blur(8px);display:none;padding:calc(env(safe-area-inset-top,0px) + 70px) 16px 16px;overflow:auto}
.ov.open{display:block}
.box{max-width:620px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.box .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:600}
.x{background:none;border:0;color:var(--muted);font-size:1.6rem;cursor:pointer;line-height:1}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;margin-bottom:14px}
.m{padding:10px 14px;border-radius:14px;font-size:.92rem;max-width:88%;white-space:pre-line}
.m.u{align-self:flex-end;background:#1a45ff}.m.b{align-self:flex-start;background:#1c1833;color:var(--text)}
.row{display:flex;gap:10px}
@media(max-width:820px){
  .form{grid-template-columns:1fr}.grid{grid-template-columns:1fr}
  .links,.bar .btn{display:none}
  .burger{display:grid}
  .bar{justify-content:space-between}
  .bar .icon.search{margin-left:auto}
  .stats,.steps{grid-template-columns:1fr}
  .hero{padding-top:130px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:20px}
.pg{padding:130px 24px 90px;min-height:85vh}
.back{display:inline-block;color:var(--muted);margin-bottom:22px;font-size:.92rem}.back:hover{color:var(--text)}
a.card{display:block;color:inherit}a.card:hover{border-color:var(--violet)}
a.stat{display:block;color:inherit}a.stat:hover{background:#17132b}
.kv{display:grid;gap:16px;max-width:760px;margin:0 auto}
.kv>div{border-bottom:1px solid var(--line);padding-bottom:14px}
.kv b{display:block;color:var(--muted);font-size:.82rem;font-weight:500;margin-bottom:4px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.sb{display:block;text-align:center;padding:26px 10px;font-weight:600;font-size:1.35rem;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.sb:hover{border-color:var(--violet);background:#17132b}
.box{max-width:680px}
h2:has(+.sub){margin-bottom:14px}
</style>
</head>

const DOC={A1:L1,A2:L1,B:['Français','Anglais','Économie','Mathématiques','Histoire-Géographie','Philosophie','SVT','PCT'],C:['Mathématiques','PCT','SVT','Français','Anglais','Histoire-Géographie','Philosophie'],D:['Mathématiques','PCT','SVT','Français','Anglais','Histoire-Géographie','Philosophie'],E:['Mathématiques','Anglais','Français','SPCT','Construction mécanique'],F1:['Mathématiques','SPCT','Anglais','Français','Construction mécanique'],F2:['Mathématiques','SPCT','EST','Construction mécanique'],F3:['Mathématiques','SPCT','Électrotechnique','EST'],F4:['Mathématiques','Anglais','Français','SPCT','Résistance des matériaux (RDM)','Béton armé'],G1:['Français','Anglais','Économie','Philosophie','Histoire-Géographie','Étude de cas'],G2:['Français','Anglais','Économie','Mathématiques','Histoire-Géographie','Étude de cas'],G3:['Français','Anglais','Économie','Mathématiques','Histoire-Géographie','Étude de cas']};
const ALIAS={'Mathématiques':'Maths','Philosophie':'Philo','Histoire-Géographie':'Hist-Géo','Économie':'Economie','SPCT':'PCT','Construction mécanique':'Construction Mécanique','Béton armé':'Béton Armé','Étude de cas':'Etude de Cas','Électrotechnique':'Electrotech','Résistance des matériaux (RDM)':'RDM'};
function SL(s){if(DOC[s])return DOC[s].map(x=>({label:x,key:ALIAS[x]||x}));
const c={};DB.filieres.forEach(f=>(f.mat||{})[s]&&f.mat[s].forEach(m=>{if(m!=='Culture générale')c[m]=(c[m]||0)+1}));
return Object.keys(c).sort((a,b)=>c[b]-c[a]).map(m=>({label:m,key:m}))}
const G={};
const SR='(A1|A2|B|C|D|E|EA|F1|F2|F3|F4|G1|G2|G3|DT|DEAT)';
function parse(q){const m=q.match(new RegExp('(?:s[ée]rie|bac)\\s+'+SR+'\\b','i'))||q.trim().match(new RegExp('^'+SR+'$','i'));const s=m?m[1].toUpperCase():null;const w=norm(q.replace(m?m[0]:'','')).split(/[^a-z0-9]+/).filter(x=>x.length>1);return{s,w}}
function find(q,t,or){const{s,w}=parse(q);return ALL.map(f=>{if(t&&f.t!==t)return null;if(s&&!(f.s||[]).includes(s))return null;let sc=0;w.forEach(x=>{if(f.k.includes(x))sc++});if(w.length&&(or?sc===0:sc<w.length))return null;return{f,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).map(x=>x.f)}
function tg(c,txt,cls){c.append(el('span','tag'+(cls?' '+cls:''),txt))}
function card(f,tag){const c=el('a','card');c.href='#fiche-'+f.id;c.append(el('h4',null,f.n),el('p',null,f.e+(f.sub?' · '+f.sub:'')));
tg(c,f.t==='public'?'Public':'Privé');
if(f.t==='public'){tg(c,'Entrée : '+f.mode);tg(c,'Séries '+f.s.join(', '));if(f.qb)tg(c,'Bourses : '+f.qb);if(f.qa)tg(c,'Aide FPP : '+f.qa)}else{if(f.d)tg(c,f.d);if(f.r)tg(c,f.r)}
if(tag)tg(c,tag[1],tag[0]);return c}
function show(box,list,tagFn,lim){lim=lim||24;box.replaceChildren();if(!list.length){box.append(el('p','empty','Aucun résultat. Essaie un autre mot-clé.'));return}
let n=0;const more=()=>{const old=box.querySelector('.more');if(old)old.remove();list.slice(n,n+lim).forEach(f=>box.append(card(f,tagFn&&tagFn(f))));n+=lim;if(n<list.length){const b=el('button','btn ghost more','Voir plus ('+(list.length-n)+' restantes)');b.style.gridColumn='1/-1';b.addEventListener('click',more);box.append(b)}};more()}
function shell(title,sub,back){const s=el('section','pg'),w=el('div','wrap');if(back){const a=el('a','back','← '+back[1]);a.href=back[0];w.append(a)}w.append(el('h2',null,title));if(sub)w.append(el('p','sub',sub));s.append(w);return[s,w]}
function cta(label,href){const a=el('a','btn',label);a.href=href;return a}
let ft='';
const P={};
P.accueil=()=>{const d=el('div');d.innerHTML=`<section class="hero"><div class="glow"></div><div class="rays"></div><div class="hero-in"><p class="eyebrow g">Ton orientation après le bac</p><h1>Choisis ta filière avec clarté.</h1><p class="lead">OrientYourself aide les bacheliers du Bénin à comparer les filières publiques et privées, à partir de leur série et de leurs notes. Moins de doutes, un classement clair.</p><div class="cta"><a class="btn" href="#simulateur">Lancer le simulateur</a><a class="btn ghost" href="#filieres">Voir les filières</a></div></div></section>
<section class="s proof"><div class="wrap"><h2>Du bac à l’inscription, <span class="g">sur des données officielles.</span></h2><p class="sub">Toutes les filières viennent du Guide d’information du MESRS 2026–2027, rassemblées au même endroit.</p><div class="stats"><a class="stat" href="#filieres"><b class="g">224</b><span>filières d’universités publiques</span></a><a class="stat" href="#filieres"><b class="g">753</b><span>offres d’établissements privés</span></a><a class="stat" href="#bourses"><b class="g">2026–27</b><span>bourses et aide FPP par filière</span></a></div></div></section>
<section class="s"><div class="wrap"><h2>Trois étapes pour <span class="g">trouver ta voie.</span></h2><p class="sub">Chaque étape s’ouvre sur sa propre page.</p><ol class="steps"><li><h3>Indique ta série</h3><p>Ta série détermine les filières auxquelles tu peux accéder.</p></li><li><h3>Saisis tes notes</h3><p>Tu ne vois que les matières demandées pour ta série.</p></li><li><h3>Reçois ton classement</h3><p>Les filières sont classées avec les établissements qui les proposent.</p></li></ol><div class="cta" style="margin-top:36px"><a class="btn" href="#simulateur">Choisir ma série</a><a class="btn ghost" href="#macai">Poser une question à MacAI</a></div></div></section>`;return d};
P.filieres=()=>{const[s,w]=shell('Explore les filières.','Cherche par nom, établissement ou série de bac. Clique sur une filière pour voir sa fiche.');
const q=el('input');q.type='search';q.placeholder='Ex. génie civil, UAC, série C…';q.setAttribute('aria-label','Rechercher');q.style.cssText='max-width:520px;margin:0 auto 18px;display:block';
const chips=el('div','chips');[['','Toutes'],['public','Public'],['privé','Privé']].forEach(([v,l])=>{const b=el('button','chip',l);b.setAttribute('aria-pressed',v===ft);b.addEventListener('click',()=>{ft=v;chips.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});chips.append(b)});
const g=el('div','grid');const draw=()=>show(g,find(q.value,ft));q.addEventListener('input',draw);w.append(q,chips,g,el('p','note','Source : Guide d’information MESRS 2026–2027.'));draw();return s};
P.fiche=id=>{const f=BYID.get(id);if(!f){location.hash='filieres';return null}
const[s,w]=shell(f.n,f.e+(f.sub?' · '+f.sub:''),['#filieres','Toutes les filières']);const kv=el('div','kv');
const row=(k,v)=>{if(!v||(Array.isArray(v)&&!v.length))return;const d=el('div');d.append(el('b',null,k));if(Array.isArray(v)){const u=el('ul');u.style.cssText='margin:0;padding-left:18px';v.forEach(x=>u.append(el('li',null,x)));d.append(u)}else d.append(el('span',null,v));kv.append(d)};
if(f.t==='public'){row('Type','Public');row('Établissement',f.e);row('Unité de formation',f.sub);row('Mode d’entrée',f.mode);row('Séries admises',f.s.join(', '));
row('Matières demandées',Object.keys(f.mat).map(k=>k+' : '+f.mat[k].join(', ')));row('Bourses',f.qb?String(f.qb):'');row('Aide FPP',f.qa?String(f.qa):'');row('Débouchés',f.deb)}
else{row('Type','Privé');row('Établissement',f.e);row('Diplôme',f.d);row('Statut',f.r);
const o=ALL.filter(x=>x.t==='privé'&&x.e===f.e&&x.id!==f.id);if(o.length){const d=el('div');d.append(el('b',null,'Autres offres de cet établissement'));const g=el('div','grid');g.style.marginTop='10px';o.slice(0,10).forEach(x=>g.append(card(x)));d.append(g);kv.append(d)}}
w.append(kv);return s};
P.simulateur=()=>{const[s,w]=shell('Choisis ta série de bac.','Tu seras dirigé vers la page de ta série, avec uniquement les matières demandées pour le classement.');const g=el('div','sgrid');SERIES.forEach(x=>{const a=el('a','sb',x);a.href='#serie-'+x;g.append(a)});w.append(g);return s};
const split=a=>{const i=a.indexOf('-');return i<0?[a,'']:[a.slice(0,i),a.slice(i+1)]};
const MM=['Mathématiques','Maths'],SS=['SPCT','PCT'],FF=['Français','Français'],AN=['Anglais','Anglais'],CM=['Construction mécanique','Construction Mécanique'];
const DTS=[['BTP','DT/BTP',[MM,SS,['RDM','RDM']]],['DPB','DT/DPB',[MM,SS,['RDM','RDM']]],['OG','DT/OG',[MM,SS,['Technologie (ENSET)','Technologie'],['DRT (EGR)','DRT']]],
['IMI','DT/IMI',[['Maths appliquées','Maths appliquées'],FF,['Technologie des systèmes informatiques','Technologie des systèmes informatiques']]],
['DWM','DT/DWM',[['Maths appliquées','Maths appliquées'],FF,['Sites et applications Web','Sites et Applications Web']]],
['PM','DT/PM',[['Projet informatique','Projet informatique'],FF]],
['MA','DT/MA',[MM,SS,['Mécanique','Mécanique']]],['FM','DT/FM',[MM,SS,CM]],['CEMS','DT/CEMS',[MM,SS,CM]],
['ELEC','DT/Électrotech',[MM,SS,['Électrotechnique','Electrotech']]],
['EAP','DT/EAP',[['Sciences appliquées','Sciences Appliquées'],FF,['Étude électronique','Etude Electronique']]],
['FC','DT/FC',[MM,['Technique de froid','Technique de Froid'],['Technologie de spécialité','Technologie de spécialité']]],
['STI','DT/STI',[FF,['Histoire-Géographie','Hist-Géo'],AN,MM]],
['COM','DT/Com',[['Technique comptable et mercatique','Techn Compta et Mercatique'],FF,['Organisation et administration rationnelle des ressources','Organisation et Administration rationnelle des ressources']]],
['MUS','DT/Musique',[['Harmonie','Harmonie'],['Théorie musicale','Théorie musicale'],['Organologie','Organologie'],['Musique assistée par ordinateur','Musique assistée par ordinateur']]]];
const DEATS=[['PV','DEAT/PV — Production végétale',/vegetal|semenc|horticult/],['PA','DEAT/PA — Production animale',/animal|halieut/],['FOR','DEAT/Foresterie',/foret|forest|ressources naturelles/],['PECHE','DEAT/Pêche et aquaculture',/peche|aquacult|hydrobiolog/],['AER','DEAT/AER — Aménagement et équipement rural',/agroequip|genie rural|maitrise de l.eau|machinisme|rurales|assainissement/],['NUTRI','DEAT/Nutrition et technologie alimentaire',/nutrition|alimentaire|conditionnement|agro-aliment|bio-ressources|microbiologie/],['TOUTES','DEAT (toutes options)',null]];
function formPage(title,sub,back,fields,key,btn,notes){const[s,w]=shell(title,sub,back);(notes||[]).forEach(n=>w.append(el('p','note',n)));
const box=el('div','ng');box.style.marginTop='26px';const saved=G[key]||{};
fields.forEach(m=>{const d=el('div');d.append(el('label',null,m.label));const i=el('input');i.type='number';i.min=0;i.max=20;i.step=0.1;i.inputMode='decimal';i.placeholder='/20';i.dataset.k=m.key;i.setAttribute('aria-label',m.label);if(saved[m.key]!==undefined)i.value=saved[m.key];d.append(i);box.append(d)});
const msg=el('p','empty');const b=el('button','btn',btn);
b.addEventListener('click',()=>{const g={};box.querySelectorAll('input').forEach(i=>{const v=parseFloat(i.value);if(!isNaN(v)&&v>=0&&v<=20)g[i.dataset.k]=v});
const need=key.startsWith('DEAT')?3:1;if(Object.keys(g).length<need){msg.textContent=need===3?'Renseigne les trois notes (entre 0 et 20).':'Entre au moins une note (entre 0 et 20).';return}G[key]=g;location.hash='resultats-'+key});
const c=el('div','cta');c.style.marginTop='24px';c.append(b);w.append(box,c,msg);return s}
function choicePage(title,sub,list,sr,back){const[s,w]=shell(title,sub,back);const g=el('div','grid');list.forEach(x=>{const a=el('a','card');a.href='#serie-'+sr+'-'+x[0];a.append(el('h4',null,x[1]));g.append(a)});w.append(g);return s}
P.serie=arg=>{const[sr,sp]=split(arg);if(!SERIES.includes(sr)){location.hash='simulateur';return null}
if(sr==='DT'){if(!sp)return choicePage('DT : ta spécialité.','Choisis la spécialité de ton diplôme de technicien. La page suivante demande les matières de cette spécialité.',DTS,'DT',['#simulateur','Changer de série']);
const x=DTS.find(d=>d[0]===sp);if(!x){location.hash='serie-DT';return null}
return formPage(x[1],'Entre tes notes sur 20. Laisse vide une matière que tu n’as pas.',['#serie-DT','Changer de spécialité'],x[2].map(f=>({label:f[0],key:f[1]})),arg,'Voir mon classement',['Les matières d’un DT varient selon la filière visée : seules les filières dont toutes les matières sont renseignées sont classées.'])}
if(sr==='DEAT'){if(!sp)return choicePage('DEAT : ton option.','Choisis l’option de ton DEAT. La page suivante demande tes trois notes.',DEATS,'DEAT',['#simulateur','Changer de série']);
const x=DEATS.find(d=>d[0]===sp);if(!x){location.hash='serie-DEAT';return null}
return formPage(x[1],'Le guide retient les trois matières écrites. Renseigne tes trois notes sur 20.',['#serie-DEAT','Changer d’option'],[1,2,3].map(n=>({label:'Note '+n,key:'n'+n})),arg,'Voir les filières',['Le guide ne nomme pas les trois épreuves : les champs sont numérotés.','Sur apresmonbac.bj, les titulaires du DEAT saisissent 10 comme note de français pour vérifier leur identité. Cela ne remplace pas ces trois notes.'])}
return formPage('Série '+sr,'Entre tes notes sur 20 dans ces matières. Seules elles servent au classement. Laisse vide une matière que tu n’as pas.',['#simulateur','Changer de série'],SL(sr),arg,'Voir mon classement')};
function rank(w,res,ex){res.sort((a,b)=>b.v-a.v);const gr=el('div','grid');const M=new Map(res.map(x=>[x.f,x]));
w.append(el('p','sub',res.length+' filière'+(res.length>1?'s classées':' classée')+(ex?' · '+ex+' non classée'+(ex>1?'s':'')+' faute de note dans une matière demandée.':'.')),gr,el('p','note','Le guide retient trois matières principales avec les coefficients du bac. Ici, la moyenne est simple, sans coefficients. Elle ne prédit pas ton admission. Seules les filières accessibles par classement sont listées.'));
show(gr,res.map(x=>x.f),f=>{const x=M.get(f);return[x.v>=12?'ok':'mid',x.req.join(', ')+' : '+x.v.toFixed(1)+'/20']},12)}
const mean=(g,req)=>req.reduce((a,m)=>a+g[m],0)/req.length;
P.resultats=arg=>{const[sr,sp]=split(arg);if(!SERIES.includes(sr)){location.hash='simulateur';return null}
if((sr==='DT'||sr==='DEAT')&&!sp){location.hash='serie-'+sr;return null}
if(!G[arg]){location.hash='serie-'+arg;return null}
const g=G[arg],back=['#serie-'+arg,'Modifier mes notes'];
if(sr==='DEAT'){const x=DEATS.find(d=>d[0]===sp);if(!x){location.hash='serie-DEAT';return null}
const m=(g.n1+g.n2+g.n3)/3;const l=ALL.filter(f=>f.t==='public'&&f.mode==='Classement'&&f.s.includes('DEAT')),near=f=>x[2]&&x[2].test(norm(f.n));l.sort((a,b)=>near(b)-near(a));
const[s,w]=shell(x[1],'Moyenne de tes trois notes : '+m.toFixed(1)+'/20. '+l.length+' filières du guide acceptent les DEAT par classement.',back);const gr=el('div','grid');w.append(gr,el('p','note','Le guide ne détaille pas les épreuves ni les filières option par option. « Proche de ton option » vient d’une correspondance par mots-clés avec les exemples du guide. Vérifie la ligne de la filière.'));
show(gr,l,f=>near(f)?['ok','Proche de ton option']:null,12);return s}
if(sr==='DT'){const x=DTS.find(d=>d[0]===sp);if(!x){location.hash='serie-DT';return null}
const keys=x[2].map(f=>f[1]),res=[];let ex=0;
ALL.forEach(f=>{if(f.t!=='public'||f.mode!=='Classement'||!f.s.includes('DT'))return;const req=(f.mat.DT||[]).filter(m=>m!=='Culture générale');if(!req.length||!req.every(m=>keys.includes(m)))return;if(req.some(m=>g[m]===undefined)){ex++;return}res.push({f,v:mean(g,req),req})});
const[s,w]=shell('Ton classement, '+x[1],'',back);rank(w,res,ex);return s}
const names=SL(sr).map(x=>x.key),res=[];let ex=0;
ALL.forEach(f=>{if(f.t!=='public'||f.mode!=='Classement'||!f.s.includes(sr))return;const req=(f.mat[sr]||[]).filter(m=>names.includes(m));if(!req.length)return;if(req.some(m=>g[m]===undefined)){ex++;return}res.push({f,v:mean(g,req),req})});
const[s,w]=shell('Ton classement, série '+sr,'',back);rank(w,res,ex);return s};
P.bourses=()=>{const[s,w]=shell('Bourses et aide FPP.','Chaque filière publique du guide indique un nombre de bourses et d’aide FPP. Les montants de l’arrêté 2026 ne sont pas inclus dans cette page.');
const l=ALL.filter(f=>f.t==='public'&&(f.qb||f.qa)).sort((a,b)=>(b.qb||0)-(a.qb||0));const g=el('div','grid');w.append(g);show(g,l);return s};
P.recherche=()=>{const[s,w]=shell('Rechercher.','Filières publiques et privées, par nom, établissement ou série.');const q=el('input');q.type='search';q.placeholder='Nom, établissement, série…';q.setAttribute('aria-label','Rechercher');q.style.cssText='max-width:520px;margin:0 auto 22px;display:block';const g=el('div','grid');const draw=()=>show(g,find(q.value,''),null,12);q.addEventListener('input',draw);w.append(q,g);draw();setTimeout(()=>q.focus(),50);return s};
const CH=[{c:'b',t:'Bonjour, je suis MacAI. Demande-moi une filière, un établissement ou une série de bac.'}];
function reply(q){const nq=norm(q);if(/^(bonjour|salut|bonsoir|hello|coucou)\b/.test(nq))return'Bonjour ! Pose-moi une question sur une filière, un établissement ou une série de bac.';
if(/bourse|fpp/.test(nq)&&!parse(q).w.filter(w=>!/bourse|fpp|aide|montant|combien/.test(w)).length)return'Chaque filière publique du guide indique un nombre de bourses et d’aide FPP. Les montants de l’arrêté 2026 ne sont pas dans cette page. Dis-moi une filière pour voir ses places.';
let l=find(q,'',false);if(!l.length)l=find(q,'',true);
if(!l.length)return'Je n’ai rien trouvé dans le guide. Essaie un nom de filière, un établissement ou une série (ex. « série C »). Pour un conseil personnalisé, appelle le 0198864336 ou le 0193173811.';
return'Voici ce que j’ai trouvé dans le guide MESRS 2026–2027 :\n'+l.slice(0,5).map(f=>f.t==='public'?'• '+f.n+' — '+f.sub+', '+f.e+' · entrée : '+f.mode+(f.qb?' · bourses : '+f.qb:'')+(f.qa?' · aide FPP : '+f.qa:'')+(/debouch/.test(nq)&&f.deb.length?'\n  Débouchés : '+f.deb.slice(0,4).join(', '):''):'• '+f.n+' ('+(f.d||'—')+') — '+f.e+(f.r?' · '+f.r:'')).join('\n')+(l.length>5?'\n… et '+(l.length-5)+' autres résultats dans la page Filières.':'')}
P.macai=()=>{const[s,w]=shell('MacAI','Pose ta question, la réponse vient du guide MESRS 2026–2027.');const box=el('div','box');box.style.padding='20px';const ms=el('div','msgs');ms.style.maxHeight='50vh';const add=(c,t)=>{const d=el('div','m '+c,t);ms.append(d);ms.scrollTop=1e9};CH.forEach(x=>add(x.c,x.t));
const f=el('form','row');const i=el('input');i.placeholder='Ta question…';i.setAttribute('aria-label','Ta question');const b=el('button','btn','Envoyer');b.type='submit';f.append(i,b);
f.addEventListener('submit',e=>{e.preventDefault();const q=i.value.trim();if(!q)return;i.value='';CH.push({c:'u',t:q});add('u',q);setTimeout(()=>{const a=reply(q);CH.push({c:'b',t:a});add('b',a)},250)});
box.append(ms,f);w.append(box);setTimeout(()=>i.focus(),50);return s};
const TITLES={accueil:'OrientYourself',filieres:'Filières',simulateur:'Simulateur',serie:'Notes',resultats:'Classement',fiche:'Fiche',bourses:'Bourses',recherche:'Recherche',macai:'MacAI'};
function route(){const h=location.hash.slice(1)||'accueil';const i=h.indexOf('-');const p=i<0?h:h.slice(0,i),arg=i<0?'':h.slice(i+1);const app=$('app');
if(!P[p]){location.hash='accueil';return}
const out=P[p](arg);if(!out)return;app.replaceChildren(out);document.title=(TITLES[p]||'OrientYourself')+(p==='accueil'?'':' · OrientYourself');
$('menu').classList.remove('open');$('burger').setAttribute('aria-expanded','false');window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
$('sbtn').addEventListener('click',()=>{location.hash='recherche'});
route();
